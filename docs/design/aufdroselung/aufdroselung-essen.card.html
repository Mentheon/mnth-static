<!-- @dsCard group="Aufdröselung" viewport="700x170" name="Essen" subtitle="Public mascot, 32×32 grid, five states — render at ×3" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-sans)}
.wrap{padding:18px 20px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.it{display:flex;flex-direction:column;gap:6px;align-items:center}
.it img{image-rendering:pixelated;display:block}
.lbl{white-space:nowrap;font-family:var(--font-mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-quiet)}
.dark{background:#1A0226;padding:14px;display:flex;gap:14px;align-items:flex-end}
.flip{width:130px;height:130px;perspective:600px}
.flip .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip 8s cubic-bezier(.65,0,.35,1) infinite}
.flip img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden}
.flip img+img{transform:rotateY(180deg)}
@keyframes flip{0%,32.5%{transform:rotateY(0)}50%,82.5%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
</style></head><body><div class="wrap"><div class="it"><img src="../assets/essen/essen-idle.svg" width="96" height="96" alt="idle"><span class="lbl">idle</span></div><div class="it"><img src="../assets/essen/essen-hungry.svg" width="96" height="96" alt="hungry"><span class="lbl">hungry</span></div><div class="it"><img src="../assets/essen/essen-eating.svg" width="96" height="96" alt="eating"><span class="lbl">eating</span></div><div class="it"><img src="../assets/essen/essen-full.svg" width="96" height="96" alt="full · day met"><span class="lbl">full · day met</span></div><div class="it"><img src="../assets/essen/essen-guide.svg" width="96" height="96" alt="guide"><span class="lbl">guide</span></div></div></body></html>
